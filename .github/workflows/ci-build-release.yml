name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "src/**"
  pull_request_target:
    paths:
      - "Cargo.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "cargo_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Found Cargo version: $VERSION"

      - name: Generate build version with metadata
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          CARGO_VERSION="${{ steps.cargo_version.outputs.cargo_version }}"
          FULL_VERSION="${CARGO_VERSION}+build.${BUILD_NUMBER}"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Cargo.toml version: $CARGO_VERSION"
          echo "🔢 Git commit count: $BUILD_NUMBER"
          echo "✨ Generated version: $FULL_VERSION"
          echo "🏷️ Generated tag: v$FULL_VERSION"

  build:
    runs-on: ${{ matrix.platform.runner }}
    needs: generate_version
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93.1"]
        platform:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: dll
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            ext: dylib
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            ext: dylib
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename output files (Windows)
        if: matrix.platform.runner == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.platform.target }}/release/
          Get-ChildItem -Filter "*.${{ matrix.platform.ext }}" | ForEach-Object {
            $newName = "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}" + $_.Extension
            Rename-Item $_.Name $newName
            Write-Host "Renamed to: $newName"
          }

      - name: Rename output files (Unix)
        if: matrix.platform.runner != 'windows-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release/
          for file in *.${{ matrix.platform.ext }}; do
            if [ -f "$file" ]; then
              new_name="meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.${file##*.}"
              mv "$file" "$new_name"
              echo "Renamed to: $new_name"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}"
          path: |
            target/${{ matrix.platform.target }}/release/meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.*

  build_linux:
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    needs: generate_version
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93.1"]
        platform:
          - runner: ubuntu-latest
            container: ghcr.io/memecrafters/meme-generator-build-container:latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: so
          - runner: ubuntu-24.04-arm
            container: ghcr.io/memecrafters/meme-generator-build-container:arm64
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            ext: so
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename output files
        run: |
          cd target/${{ matrix.platform.target }}/release/
          for file in *.${{ matrix.platform.ext }}; do
            if [ -f "$file" ]; then
              new_name="meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.${file##*.}"
              mv "$file" "$new_name"
              echo "Renamed to: $new_name"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}"
          path: |
            target/${{ matrix.platform.target }}/release/meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.*

  build_android:
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    needs: generate_version
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93.1"]
        platform:
          - runner: ubuntu-latest
            container: ghcr.io/memecrafters/meme-generator-build-container:android
            target: aarch64-linux-android
            label: android-aarch64
            ext: so
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename output files
        run: |
          cd target/${{ matrix.platform.target }}/release/
          for file in *.${{ matrix.platform.ext }}; do
            if [ -f "$file" ]; then
              new_name="meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.${file##*.}"
              mv "$file" "$new_name"
              echo "Renamed to: $new_name"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: "meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}"
          path: |
            target/${{ matrix.platform.target }}/release/meme-emoji-${{ matrix.platform.label }}-${{ matrix.rust }}.*

  release:
    name: Create Release
    needs: [generate_version, build, build_linux, build_android]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all downloaded files
        run: |
          echo "📂 Downloaded artifacts:"
          find artifacts -type f -name "*" | sort

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate custom appendix and save to file
        id: custom
        run: |
          RUSTC_VER=$(rustc --version --verbose)
          RUSTUP_SHOW=$(rustup show)
          APPENDIX=$(cat <<EOF

          ## 🚀 构建信息
          - **版本**: \`${{ needs.generate_version.outputs.version }}\`

          这是一个自动构建的 Release，包含以下平台的动态库（每个平台提供 stable 和 1.93.1 两个版本）：
          - 🪟 Windows (x86_64)
          - 🍎 macOS (Intel)
          - 🍏 macOS (Apple Silicon)
          - 🐧 Linux (x86_64)
          - 🐧 Linux (ARM64)
          - 📱 Android (ARM64)

          ## 📦 文件列表
          - \`meme-emoji-windows-x86_64-stable.dll\` / \`meme-emoji-windows-x86_64-1.93.1.dll\` - Windows 动态链接库
          - \`meme-emoji-macos-x86_64-stable.dylib\` / \`meme-emoji-macos-x86_64-1.93.1.dylib\` - macOS Intel 动态库
          - \`meme-emoji-macos-aarch64-stable.dylib\` / \`meme-emoji-macos-aarch64-1.93.1.dylib\` - macOS Apple Silicon 动态库
          - \`meme-emoji-linux-x86_64-stable.so\` / \`meme-emoji-linux-x86_64-1.93.1.so\` - Linux x86_64 动态库
          - \`meme-emoji-linux-aarch64-stable.so\` / \`meme-emoji-linux-aarch64-1.93.1.so\` - Linux ARM64 动态库
          - \`meme-emoji-android-aarch64-stable.so\` / \`meme-emoji-android-aarch64-1.93.1.so\` - Android ARM64 动态库

          ## 🔍 版本说明
          版本号格式: \`{Cargo版本}+build.{构建号}\`
          - 构建号基于 Git 提交次数自动生成
          - 符合语义化版本规范 (SemVer)

          ## 🛠️ 构建工具链
          \`\`\`
          $RUSTC_VER
          \`\`\`
          \`\`\`
          $RUSTUP_SHOW
          \`\`\`
          EOF
          )
          echo "$APPENDIX" > /tmp/appendix.txt
          echo "file=/tmp/appendix.txt" >> $GITHUB_OUTPUT

      - name: Display version info
        run: |
          echo "🎯 Creating release with:"
          echo "   Version: ${{ needs.generate_version.outputs.version }}"
          echo "   Tag: ${{ needs.generate_version.outputs.tag }}"

      - name: Create Release (auto-generated notes)
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.generate_version.outputs.tag }}
          name: Release ${{ needs.generate_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/meme-emoji-windows-x86_64-*.*
            artifacts/**/meme-emoji-macos-x86_64-*.*
            artifacts/**/meme-emoji-macos-aarch64-*.*
            artifacts/**/meme-emoji-linux-x86_64-*.*
            artifacts/**/meme-emoji-linux-aarch64-*.*
            artifacts/**/meme-emoji-android-aarch64-*.*

      - name: Update Release with custom body (Chinese title + Rust info)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.generate_version.outputs.tag }}"
          REPO="${{ github.repository }}"

          # 获取自动生成的 body
          ORIGINAL_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)

          # 替换标题为中文
          MODIFIED_BODY=$(echo "$ORIGINAL_BODY" | sed 's/^## What'\''s Changed$/## 变更内容/')

          if [ "$MODIFIED_BODY" = "$ORIGINAL_BODY" ]; then
            echo "⚠️ 未找到 '## What's Changed'，保持原标题"
          else
            echo "✅ 已将标题替换为中文"
          fi

          # 读取附录并组合
          APPENDIX=$(cat /tmp/appendix.txt)
          FINAL_BODY="${MODIFIED_BODY}${APPENDIX}"

          # 将最终内容写入临时文件，用 --notes-file 更新（避免 --body 参数不识别）
          echo "$FINAL_BODY" > /tmp/final_body.txt
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/final_body.txt

          echo "✅ Release body 更新完成"